!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname vBond
!
ip cef
no ip domain lookup
!
interface Ethernet0/0
 ip address 100.64.0.12 255.255.255.0
 no shutdown
!
interface Loopback0
 ip address 10.255.0.2 255.255.255.255
 no shutdown
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
