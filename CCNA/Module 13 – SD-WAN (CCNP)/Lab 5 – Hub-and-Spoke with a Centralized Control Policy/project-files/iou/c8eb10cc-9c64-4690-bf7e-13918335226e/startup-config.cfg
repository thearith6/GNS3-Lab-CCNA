!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname vEdge3
!
ip cef
no ip domain lookup
!
interface Ethernet0/0
 ip address 100.64.3.2 255.255.255.0
 no shutdown
!
interface Ethernet0/1
 ip address 100.65.3.2 255.255.255.0
 no shutdown
!
interface Ethernet0/2
 ip address 192.168.3.1 255.255.255.0
 no shutdown
!
interface Loopback0
 ip address 10.255.3.1 255.255.255.255
 no shutdown
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
