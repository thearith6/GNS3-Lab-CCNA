!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SPOKE1
!
ip cef
no ip domain lookup
!
interface Ethernet0/0
 ip address 203.0.113.2 255.255.255.0
 no shutdown
!
interface Loopback1
 ip address 192.168.2.1 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
