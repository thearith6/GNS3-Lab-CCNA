!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
ip cef
no ip domain lookup
!
interface Ethernet0/0
 ip address 10.99.0.2 255.255.255.252
 no shutdown
!
interface Loopback1
 ip address 198.51.100.1 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
