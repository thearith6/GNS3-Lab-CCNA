!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SW1
!
no ip domain lookup
!
interface Ethernet0/0
 no shutdown
!
interface Vlan1
 ip address 192.168.100.11 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
